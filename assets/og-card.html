<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--cream:#F7F5ED;--steel:#395274;--navy:#192048;--gold:#F2B844}
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px}
  body{background:var(--navy);color:var(--cream);font-family:'Archivo',Helvetica,Arial,sans-serif;
       display:flex;flex-direction:column;justify-content:space-between;padding:104px 82px 0;overflow:hidden;position:relative}
  .glow{position:absolute;right:-180px;top:-200px;width:720px;height:720px;border-radius:50%;
        background:radial-gradient(circle,rgba(242,184,68,.16),rgba(242,184,68,0) 66%)}
  .top{display:flex;align-items:flex-start;gap:34px;position:relative}
  .mark{width:104px;height:98px;flex:0 0 auto}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;letter-spacing:.22em;
           text-transform:uppercase;color:var(--gold);margin-bottom:22px}
  h1{font-weight:900;letter-spacing:-.028em;line-height:.94;font-size:96px;text-transform:uppercase}
  h1 em{font-style:normal;color:var(--gold)}
  .sub{margin-top:26px;font-size:27px;line-height:1.34;color:rgba(247,245,237,.72);max-width:23ch;font-weight:500}
  .foot{position:relative;background:var(--gold);color:var(--navy);margin:0 -82px;padding:26px 82px;
        display:flex;align-items:baseline;gap:26px;font-family:'IBM Plex Mono',monospace}
  .foot .tag{font-size:15px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;opacity:.72}
  .foot .parts{font-size:20px;font-weight:600;letter-spacing:.05em}
  .foot .parts b{font-weight:600}
  .foot .dot{opacity:.4;margin:0 4px}
</style></head>
